[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "norfigures"
version = "0.1.0"
description = "Verify Norwegian economic figures against SSB and Norges Bank"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The verifier, reports, tests and `check --claims` need only the standard
# library. The extractor agent and the MCP server need these (decision D18).
agents = ["anthropic>=2.8", "mcp>=2.3"]

[project.scripts]
norfigures = "norfigures.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
