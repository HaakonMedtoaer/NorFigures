name: live sources

# The offline tests replay recordings and cannot see a source change. This job
# asks SSB, Norges Bank and NAV every Monday and fails if a series no longer
# answers in the shape the code reads. NAV has no API and is scraped (D20), so
# a redesign of its pages shows up here first. A failure means: fix the parser,
# then refresh the recordings with NORFIGURES_RECORD=1.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check every source live
        env:
          NORFIGURES_LIVE: "1"
        run: python -m unittest tests.test_live_sources -v
